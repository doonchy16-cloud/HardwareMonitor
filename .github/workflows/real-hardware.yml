name: Real Hardware Gate

on:
  push:
    branches: [ main, build/v1 ]

permissions:
  contents: read
  statuses: write

concurrency:
  group: real-hardware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  announce:
    name: Announce real hardware gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish pending hardware status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $target = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = @{ state = 'pending'; context = 'hardware-monitor/real'; description = 'Waiting for self-hosted Windows hardware gate'; target_url = $target } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } -Body $body -ContentType 'application/json' | Out-Null

  hardware:
    name: Build, test, package, and probe real hardware
    needs: announce
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 10.0.400
      - name: Runner info
        shell: powershell
        run: |
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "DOTNET_ROOT=$env:DOTNET_ROOT"
          dotnet --info
      - name: Restore solution
        run: dotnet restore HardwareMonitor.sln
      - name: Build solution
        run: dotnet build HardwareMonitor.sln --configuration Release --no-restore
      - name: Run unit tests
        run: dotnet test --solution HardwareMonitor.sln --configuration Release --no-build --minimum-expected-tests 1
      - name: Restore hardware smoke probe
        run: dotnet restore tools/HardwareMonitor.HardwareSmoke/HardwareMonitor.HardwareSmoke.csproj
      - name: Locate direct Doonchy Bridge
        id: bridge
        shell: powershell
        env:
          BRIDGE_ROOT_OVERRIDE: ${{ vars.DOONCHY_BRIDGE_ROOT }}
        run: |
          function Test-DirectBridgeRoot([string]$Path) {
            if ([string]::IsNullOrWhiteSpace($Path)) { return $false }
            $transportPath = Join-Path $Path 'config\transport-v2.local.json'
            $identityPath = Join-Path $Path 'config\identity.json'
            if (-not (Test-Path $transportPath) -or -not (Test-Path $identityPath)) { return $false }
            try {
              $transport = Get-Content $transportPath -Raw | ConvertFrom-Json
              $identity = Get-Content $identityPath -Raw | ConvertFrom-Json
              return $transport.schema_version -eq '2.0' `
                -and $transport.mode -eq 'direct' `
                -and -not [string]::IsNullOrWhiteSpace([string]$transport.gateway_url) `
                -and ([string]$transport.host_token).Length -ge 24 `
                -and $identity.schema_version -eq '1.1' `
                -and -not [string]::IsNullOrWhiteSpace([string]$identity.device_id)
            }
            catch { return $false }
          }

          $matches = @()
          if (-not [string]::IsNullOrWhiteSpace($env:BRIDGE_ROOT_OVERRIDE)) {
            if (-not (Test-DirectBridgeRoot $env:BRIDGE_ROOT_OVERRIDE)) {
              throw 'DOONCHY_BRIDGE_ROOT does not point to a valid direct Bridge installation.'
            }
            $matches = @((Resolve-Path $env:BRIDGE_ROOT_OVERRIDE).Path)
          }
          else {
            foreach ($drive in Get-PSDrive -PSProvider FileSystem) {
              try {
                foreach ($directory in Get-ChildItem -Path $drive.Root -Directory -Force -ErrorAction Stop) {
                  if (Test-DirectBridgeRoot $directory.FullName) {
                    $matches += $directory.FullName
                  }
                }
              }
              catch { }
            }
            $matches = @($matches | Sort-Object -Unique)
          }

          if ($matches.Count -ne 1) {
            throw "Expected exactly one direct Bridge installation, found $($matches.Count). Set repository variable DOONCHY_BRIDGE_ROOT to disambiguate."
          }
          "bridge_root=$($matches[0])" >> $env:GITHUB_OUTPUT
      - name: Probe actual hardware, temperatures, and private Gateway telemetry
        shell: powershell
        env:
          BRIDGE_ROOT: ${{ steps.bridge.outputs.bridge_root }}
        run: |
          $sequencePath = Join-Path $env:LOCALAPPDATA 'The Spark\Hardware Monitor\gateway-telemetry-sequence.json'
          dotnet run --project tools/HardwareMonitor.HardwareSmoke/HardwareMonitor.HardwareSmoke.csproj --configuration Release --no-restore -- `
            --gateway-bridge-root $env:BRIDGE_ROOT `
            --gateway-sequence-path $sequencePath
          if ($LASTEXITCODE -ne 0) { throw "Real hardware/Gateway smoke failed with exit code $LASTEXITCODE." }
      - name: Restore background agent smoke probe
        run: dotnet restore tools/HardwareMonitor.AgentSmoke/HardwareMonitor.AgentSmoke.csproj
      - name: Build background agent smoke probe
        run: dotnet build tools/HardwareMonitor.AgentSmoke/HardwareMonitor.AgentSmoke.csproj --configuration Release --no-restore
      - name: Publish self-contained Windows app and background agent
        shell: powershell
        run: |
          dotnet publish src/HardwareMonitor.App/HardwareMonitor.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/portable --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Hardware Monitor publish failed with exit code $LASTEXITCODE." }
          dotnet publish src/HardwareMonitor.Agent/HardwareMonitor.Agent.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/portable --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Hardware Monitor agent publish failed with exit code $LASTEXITCODE." }
      - name: Verify published executables
        shell: powershell
        run: |
          foreach ($name in @('HardwareMonitor.exe', 'HardwareMonitor.Agent.exe')) {
            $exe = Join-Path $PWD "artifacts/portable/$name"
            if (-not (Test-Path $exe)) { throw "$name was not published." }
            $item = Get-Item $exe
            $hash = Get-FileHash $exe -Algorithm SHA256
            Write-Host "PUBLISHED_EXE=$($item.Name)"
            Write-Host "PUBLISHED_BYTES=$($item.Length)"
            Write-Host "PUBLISHED_SHA256=$($hash.Hash)"
          }
      - name: Probe standalone background agent process and IPC on real hardware
        shell: powershell
        run: |
          $agentExe = Join-Path $PWD 'artifacts/portable/HardwareMonitor.Agent.exe'
          $pipe = "HardwareMonitor.Real.$env:GITHUB_RUN_ID"
          $profileRoot = Join-Path $env:RUNNER_TEMP "HardwareMonitor.Real.$env:GITHUB_RUN_ID"
          $profilePath = Join-Path $profileRoot 'profiles.json'
          New-Item -ItemType Directory -Path $profileRoot -Force | Out-Null

          $agentProcess = Start-Process -FilePath $agentExe -ArgumentList @(
            '--profile-path', $profilePath,
            '--pipe', $pipe,
            '--poll-ms', '250'
          ) -PassThru

          try {
            dotnet run --project tools/HardwareMonitor.AgentSmoke/HardwareMonitor.AgentSmoke.csproj --configuration Release --no-build -- $pipe
            if ($LASTEXITCODE -ne 0) { throw "Real-hardware agent smoke failed with exit code $LASTEXITCODE." }
            if (Test-Path $profilePath) { throw 'Real-hardware agent unexpectedly created or replaced the temporary profile registry.' }
          }
          finally {
            if ($agentProcess -and -not $agentProcess.HasExited) {
              Stop-Process -Id $agentProcess.Id -Force
              $agentProcess.WaitForExit()
            }
            Remove-Item $profileRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Publish setup bootstrap
        run: dotnet publish src/HardwareMonitor.Setup/HardwareMonitor.Setup.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/setup --no-restore
      - name: Verify setup executable
        shell: powershell
        run: |
          $exe = Join-Path $PWD 'artifacts/setup/HardwareMonitor-Setup.exe'
          if (-not (Test-Path $exe)) { throw 'HardwareMonitor-Setup.exe was not published.' }
          $item = Get-Item $exe
          $hash = Get-FileHash $exe -Algorithm SHA256
          Write-Host "SETUP_EXE=$($item.Name)"
          Write-Host "SETUP_BYTES=$($item.Length)"
          Write-Host "SETUP_SHA256=$($hash.Hash)"
      - name: Build and validate unsigned MSIX
        shell: powershell
        run: ./packaging/Build-Msix.ps1 -Version 1.0.0.0 -Publisher 'CN=The Spark' -ReleaseTag v1.0.0
      - name: Verify MSIX staged background agent
        shell: powershell
        run: |
          $agent = Join-Path $PWD 'artifacts/package/stage/HardwareMonitor.Agent.exe'
          if (-not (Test-Path $agent)) { throw 'HardwareMonitor.Agent.exe is missing from the MSIX stage.' }
          $hash = Get-FileHash $agent -Algorithm SHA256
          Write-Host "MSIX_AGENT_SHA256=$($hash.Hash)"
      - name: Upload portable verification build
        uses: actions/upload-artifact@v4
        with:
          name: HardwareMonitor-v1-portable-win-x64
          path: artifacts/portable
          if-no-files-found: error
          retention-days: 7
      - name: Upload setup verification build
        uses: actions/upload-artifact@v4
        with:
          name: HardwareMonitor-v1-setup-win-x64
          path: artifacts/setup
          if-no-files-found: error
          retention-days: 7
      - name: Upload MSIX verification package
        uses: actions/upload-artifact@v4
        with:
          name: HardwareMonitor-v1-msix-unsigned
          path: |
            artifacts/package/*.msix
            artifacts/package/*.appinstaller
          if-no-files-found: error
          retention-days: 7

  report:
    name: Report real hardware gate
    if: always()
    needs: [announce, hardware]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish terminal hardware status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HARDWARE_RESULT: ${{ needs.hardware.result }}
        run: |
          $state = if ($env:HARDWARE_RESULT -eq 'success') { 'success' } else { 'failure' }
          $description = if ($state -eq 'success') { 'Real Windows hardware, Gateway telemetry, agent IPC, tests, and MSIX gate passed' } else { "Real Windows hardware/Gateway/MSIX gate: $env:HARDWARE_RESULT" }
          $target = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = @{ state = $state; context = 'hardware-monitor/real'; description = $description; target_url = $target } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } -Body $body -ContentType 'application/json' | Out-Null
