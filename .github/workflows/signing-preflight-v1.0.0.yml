name: Signing Preflight v1.0.0

on:
  push:
    branches:
      - release/v1.0.0-signing-probe

permissions:
  contents: read
  statuses: write

env:
  PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
  PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Validate production signing secrets and certificate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $statusUrl = "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA"

          function Publish-Status([string]$context, [string]$state, [string]$description) {
            $payload = @{ state = $state; context = $context; description = $description } | ConvertTo-Json -Compress
            $payload | gh api --method POST $statusUrl --input - | Out-Null
          }

          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            Publish-Status 'hardware-monitor/signing-secrets' 'failure' 'Required production signing secrets are not configured'
            Publish-Status 'hardware-monitor/signing-certificate' 'pending' 'Certificate validation cannot run until signing secrets exist'
            throw 'Required signing secrets WINDOWS_SIGNING_PFX_BASE64 and/or WINDOWS_SIGNING_PFX_PASSWORD are not configured.'
          }

          Publish-Status 'hardware-monitor/signing-secrets' 'success' 'Required production signing secrets are configured'
          Publish-Status 'hardware-monitor/signing-certificate' 'pending' 'Validating production signing certificate'

          $pfxPath = Join-Path $env:RUNNER_TEMP 'hardwaremonitor-signing-preflight.pfx'
          try {
            [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
            $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfxPath, $env:PFX_PASSWORD, $flags)
            if (-not $cert.HasPrivateKey) { throw 'Signing certificate has no private key.' }
            if ($cert.NotBefore -gt (Get-Date)) { throw 'Signing certificate is not valid yet.' }
            if ($cert.NotAfter -le (Get-Date).AddDays(30)) { throw 'Signing certificate expires within 30 days.' }
            if ([string]::IsNullOrWhiteSpace($cert.Subject)) { throw 'Signing certificate subject is empty.' }

            Publish-Status 'hardware-monitor/signing-certificate' 'success' 'Production signing certificate is valid'
            Write-Host "SIGNING_CERTIFICATE=PASS"
            Write-Host "PUBLISHER=$($cert.Subject)"
            Write-Host "VALID_THROUGH=$($cert.NotAfter.ToUniversalTime().ToString('u'))"
          }
          catch {
            Publish-Status 'hardware-monitor/signing-certificate' 'failure' 'Configured production signing certificate is invalid'
            Write-Error $_
            exit 1
          }
          finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }
