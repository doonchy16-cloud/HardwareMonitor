name: Signing Smoke v1.0.0

on:
  push:
    branches:
      - release/v1.0.0-signing-smoke

permissions:
  contents: read
  statuses: write

env:
  TARGET_SHA: 2170b36a981f743f0edc7a75dd2336c597d12a81
  TIMESTAMP_URL: http://timestamp.digicert.com

jobs:
  signing-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Publish pending status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $payload = @{ state='pending'; context='hardware-monitor/signing-pipeline-smoke'; description='Testing MSIX and Setup signing pipeline with ephemeral test certificate' } | ConvertTo-Json -Compress
          $payload | gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" --input - | Out-Null

      - name: Checkout authoritative main candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      - name: Create ephemeral test signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $passwordPlain = [guid]::NewGuid().ToString('N')
          $rsa = [System.Security.Cryptography.RSA]::Create(3072)
          $request = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
            'CN=The Spark Test Signing',
            $rsa,
            [System.Security.Cryptography.HashAlgorithmName]::SHA256,
            [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)

          $eku = [System.Security.Cryptography.OidCollection]::new()
          [void]$eku.Add([System.Security.Cryptography.Oid]::new('1.3.6.1.5.5.7.3.3'))
          $request.CertificateExtensions.Add([System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new($eku, $false))
          $request.CertificateExtensions.Add([System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension]::new($false, $false, 0, $true))
          $request.CertificateExtensions.Add([System.Security.Cryptography.X509Certificates.X509SubjectKeyIdentifierExtension]::new($request.PublicKey, $false))

          $cert = $request.CreateSelfSigned((Get-Date).AddMinutes(-5), (Get-Date).AddDays(7))
          $pfxPath = Join-Path $env:RUNNER_TEMP 'hardwaremonitor-test-signing.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx, $passwordPlain))

          "TEST_PFX_PATH=$pfxPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TEST_PFX_PASSWORD=$passwordPlain" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TEST_PUBLISHER=$($cert.Subject)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TEST_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Ephemeral test signing certificate created: $($cert.Subject)"

      - name: Restore solution
        run: dotnet restore HardwareMonitor.sln

      - name: Build solution
        run: dotnet build HardwareMonitor.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --solution HardwareMonitor.sln --configuration Release --no-build --minimum-expected-tests 1

      - name: Build unsigned MSIX
        shell: pwsh
        run: |
          ./packaging/Build-Msix.ps1 `
            -Version '1.0.0.0' `
            -Publisher $env:TEST_PUBLISHER `
            -ReleaseTag 'v1.0.0'

      - name: Sign and inspect timestamped MSIX
        shell: pwsh
        run: |
          $kitsBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $signTool = Get-ChildItem $kitsBin -Filter SignTool.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\SignTool\.exe$' } |
            Sort-Object { try { [version]$_.Directory.Parent.Name } catch { [version]'0.0' } } -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw 'SignTool.exe was not found.' }

          $msix = Get-ChildItem 'artifacts/package' -Filter '*.msix' | Select-Object -First 1
          if (-not $msix) { throw 'Unsigned MSIX was not produced.' }

          & $signTool.FullName sign /fd SHA256 /a /f $env:TEST_PFX_PATH /p $env:TEST_PFX_PASSWORD /tr $env:TIMESTAMP_URL /td SHA256 $msix.FullName
          if ($LASTEXITCODE -ne 0) { throw "MSIX signing or timestamping failed with exit code $LASTEXITCODE." }

          $sig = Get-AuthenticodeSignature -FilePath $msix.FullName
          if (-not $sig.SignerCertificate) { throw 'MSIX does not contain an Authenticode signer certificate.' }
          if ($sig.SignerCertificate.Thumbprint -ne $env:TEST_CERT_THUMBPRINT) { throw 'MSIX signer thumbprint does not match the ephemeral test certificate.' }
          if (-not $sig.TimeStamperCertificate) { throw 'MSIX does not contain an RFC3161 timestamp signer.' }
          Write-Host "MSIX_SIGNER=$($sig.SignerCertificate.Subject)"
          Write-Host "MSIX_TIMESTAMPER=$($sig.TimeStamperCertificate.Subject)"

      - name: Publish setup bootstrap
        run: dotnet publish src/HardwareMonitor.Setup/HardwareMonitor.Setup.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/setup --no-restore

      - name: Sign and inspect timestamped setup bootstrap
        shell: pwsh
        run: |
          $kitsBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $signTool = Get-ChildItem $kitsBin -Filter SignTool.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\SignTool\.exe$' } |
            Sort-Object { try { [version]$_.Directory.Parent.Name } catch { [version]'0.0' } } -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw 'SignTool.exe was not found.' }

          $setupExe = Join-Path $PWD 'artifacts/setup/HardwareMonitor-Setup.exe'
          & $signTool.FullName sign /fd SHA256 /a /f $env:TEST_PFX_PATH /p $env:TEST_PFX_PASSWORD /tr $env:TIMESTAMP_URL /td SHA256 $setupExe
          if ($LASTEXITCODE -ne 0) { throw "Setup signing or timestamping failed with exit code $LASTEXITCODE." }

          $sig = Get-AuthenticodeSignature -FilePath $setupExe
          if (-not $sig.SignerCertificate) { throw 'Setup EXE does not contain an Authenticode signer certificate.' }
          if ($sig.SignerCertificate.Thumbprint -ne $env:TEST_CERT_THUMBPRINT) { throw 'Setup EXE signer thumbprint does not match the ephemeral test certificate.' }
          if (-not $sig.TimeStamperCertificate) { throw 'Setup EXE does not contain an RFC3161 timestamp signer.' }
          Write-Host "SETUP_SIGNER=$($sig.SignerCertificate.Subject)"
          Write-Host "SETUP_TIMESTAMPER=$($sig.TimeStamperCertificate.Subject)"

      - name: Publish terminal success status
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $payload = @{ state='success'; context='hardware-monitor/signing-pipeline-smoke'; description='MSIX and Setup signing/timestamp pipeline passed with ephemeral test certificate' } | ConvertTo-Json -Compress
          $payload | gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" --input - | Out-Null

      - name: Publish terminal failure status
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $payload = @{ state='failure'; context='hardware-monitor/signing-pipeline-smoke'; description='MSIX or Setup signing/timestamp pipeline failed during smoke test' } | ConvertTo-Json -Compress
          $payload | gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" --input - | Out-Null

      - name: Remove ephemeral test signing material
        if: always()
        shell: pwsh
        run: |
          Remove-Item $env:TEST_PFX_PATH -Force -ErrorAction SilentlyContinue
