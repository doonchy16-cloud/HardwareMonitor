name: Phase 6B PR test

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/HardwareMonitor.Agent/**'
      - 'src/HardwareMonitor.Sensors/**'
      - 'tests/HardwareMonitor.Sensors.Tests/**'
      - 'tools/HardwareMonitor.HardwareSmoke/**'
      - '.github/workflows/real-hardware.yml'
      - '.github/workflows/phase6b-pr-test.yml'

permissions:
  contents: read

jobs:
  phase6b:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 10.0.400
      - name: Restore solution
        run: dotnet restore HardwareMonitor.sln
      - name: Restore hardware smoke probe
        run: dotnet restore tools/HardwareMonitor.HardwareSmoke/HardwareMonitor.HardwareSmoke.csproj
      - name: Build solution
        run: dotnet build HardwareMonitor.sln --configuration Release --no-restore
      - name: Build hardware smoke probe
        run: dotnet build tools/HardwareMonitor.HardwareSmoke/HardwareMonitor.HardwareSmoke.csproj --configuration Release --no-restore
      - name: Run solution tests
        run: dotnet test --solution HardwareMonitor.sln --configuration Release --no-build --minimum-expected-tests 1
      - name: Locate direct Doonchy Bridge
        id: bridge
        shell: powershell
        env:
          BRIDGE_ROOT_OVERRIDE: ${{ vars.DOONCHY_BRIDGE_ROOT }}
        run: |
          function Test-DirectBridgeRoot([string]$Path) {
            if ([string]::IsNullOrWhiteSpace($Path)) { return $false }
            $transportPath = Join-Path $Path 'config\transport-v2.local.json'
            $identityPath = Join-Path $Path 'config\identity.json'
            if (-not (Test-Path $transportPath) -or -not (Test-Path $identityPath)) { return $false }
            try {
              $transport = Get-Content $transportPath -Raw | ConvertFrom-Json
              $identity = Get-Content $identityPath -Raw | ConvertFrom-Json
              return $transport.schema_version -eq '2.0' `
                -and $transport.mode -eq 'direct' `
                -and -not [string]::IsNullOrWhiteSpace([string]$transport.gateway_url) `
                -and ([string]$transport.host_token).Length -ge 24 `
                -and $identity.schema_version -eq '1.1' `
                -and -not [string]::IsNullOrWhiteSpace([string]$identity.device_id)
            }
            catch { return $false }
          }

          $matches = @()
          if (-not [string]::IsNullOrWhiteSpace($env:BRIDGE_ROOT_OVERRIDE)) {
            if (-not (Test-DirectBridgeRoot $env:BRIDGE_ROOT_OVERRIDE)) {
              throw 'DOONCHY_BRIDGE_ROOT does not point to a valid direct Bridge installation.'
            }
            $matches = @((Resolve-Path $env:BRIDGE_ROOT_OVERRIDE).Path)
          }
          else {
            foreach ($drive in Get-PSDrive -PSProvider FileSystem) {
              try {
                foreach ($directory in Get-ChildItem -Path $drive.Root -Directory -Force -ErrorAction Stop) {
                  if (Test-DirectBridgeRoot $directory.FullName) {
                    $matches += $directory.FullName
                  }
                }
              }
              catch { }
            }
            $matches = @($matches | Sort-Object -Unique)
          }

          if ($matches.Count -ne 1) {
            throw "Expected exactly one direct Bridge installation, found $($matches.Count). Set repository variable DOONCHY_BRIDGE_ROOT to disambiguate."
          }
          "bridge_root=$($matches[0])" >> $env:GITHUB_OUTPUT
      - name: Diagnose installed and live Gateway telemetry route parity
        id: parity
        shell: powershell
        env:
          BRIDGE_ROOT: ${{ steps.bridge.outputs.bridge_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $telemetryMerge = 'efff06aed3af0c1daa570ebdbe5d1b0d4fe95909'
          $installedSha = (git -C $env:BRIDGE_ROOT rev-parse HEAD).Trim()
          $dirty = -not [string]::IsNullOrWhiteSpace((git -C $env:BRIDGE_ROOT status --porcelain | Out-String).Trim())
          git -C $env:BRIDGE_ROOT merge-base --is-ancestor $telemetryMerge HEAD 2>$null
          $containsTelemetryMerge = $LASTEXITCODE -eq 0
          $gatewaySource = Join-Path $env:BRIDGE_ROOT 'src\bridge_gateway.py'
          $routeText = "/v2/host/hardware-monitor/telemetry"
          $routeInSource = (Test-Path $gatewaySource) -and [bool](Select-String -Path $gatewaySource -SimpleMatch $routeText -Quiet)
          Write-Host "BRIDGE_SOURCE_PARITY installed_sha=$installedSha dirty=$dirty contains_telemetry_merge=$containsTelemetryMerge route_in_source=$routeInSource"

          $fleetPath = Join-Path $env:BRIDGE_ROOT 'config\fleet.json'
          if (-not (Test-Path $fleetPath)) { throw 'Bridge fleet topology config is missing.' }
          $fleetCfg = Get-Content $fleetPath -Raw | ConvertFrom-Json
          if ($fleetCfg.schema_version -ne '2.0') { throw 'Bridge fleet topology schema is unsupported.' }
          $localBase = "http://127.0.0.1:$([int]$fleetCfg.gateway_bind_port)"
          $publicBase = ([string]$fleetCfg.gateway_public_url).TrimEnd('/')

          function Get-Status([string]$Url, [string]$Method = 'GET', [string]$Body = '') {
            try {
              $args = @{ Uri=$Url; Method=$Method; UseBasicParsing=$true; TimeoutSec=10; MaximumRedirection=0 }
              if ($Body) { $args['Body']=$Body; $args['ContentType']='application/json' }
              $response = Invoke-WebRequest @args
              return [int]$response.StatusCode
            }
            catch {
              try {
                if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
                  return [int]$_.Exception.Response.StatusCode
                }
              }
              catch { }
              return -1
            }
          }

          $healthStatus = Get-Status "$localBase/health"
          $gatewayVersion = 'UNAVAILABLE'
          if ($healthStatus -eq 200) {
            try {
              $health = Invoke-RestMethod -Uri "$localBase/health" -Method Get -TimeoutSec 10
              $gatewayVersion = [string]$health.gateway_version
            }
            catch { $gatewayVersion = 'UNREADABLE' }
          }
          $localRouteUnauth = Get-Status "$localBase$routeText" 'POST' '{}'
          $publicRouteUnauth = Get-Status "$publicBase$routeText" 'POST' '{}'

          Write-Host "BRIDGE_GATEWAY_PARITY health_status=$healthStatus gateway_version=$gatewayVersion local_route_unauth=$localRouteUnauth public_route_unauth=$publicRouteUnauth"
          if ($publicRouteUnauth -eq -1 -or $publicRouteUnauth -eq 404) {
            "needs_gateway_repair=true" >> $env:GITHUB_OUTPUT
          }
          else {
            Write-Host "GATEWAY_PUBLIC_ROUTE_READY public_route_unauth=$publicRouteUnauth"
            "needs_gateway_repair=false" >> $env:GITHUB_OUTPUT
          }
      - name: Repair missing local Gateway generation fail-closed
        if: steps.parity.outputs.needs_gateway_repair == 'true'
        shell: powershell
        env:
          BRIDGE_ROOT: ${{ steps.bridge.outputs.bridge_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $criticalPaths = @(
            'Start_Bridge_Gateway.cmd',
            'Start_Bridge_Gateway_Hidden.vbs',
            'scripts/gateway_listener_guard.py',
            'src/bridge_gateway_mcp_v3.py',
            'src/bridge_gateway.py',
            'src/gateway_protocol.py',
            'src/gateway_lifecycle.py',
            'src/runtime_topology.py',
            'src/runtime_maintenance.py',
            'src/windows_process.py',
            'src/bridge_common.py',
            'src/identity.py',
            'src/component_versions.py',
            'versions.json'
          )
          git -C $env:BRIDGE_ROOT diff --quiet HEAD -- $criticalPaths
          $criticalClean = $LASTEXITCODE -eq 0

          $fleet = Get-Content (Join-Path $env:BRIDGE_ROOT 'config\fleet.json') -Raw | ConvertFrom-Json
          $identity = Get-Content (Join-Path $env:BRIDGE_ROOT 'config\identity.json') -Raw | ConvertFrom-Json
          $machineMatches = ([string]$identity.machine_id).Equals([string]$fleet.gateway_host_machine_id, [System.StringComparison]::OrdinalIgnoreCase)
          $deviceMatches = ([string]$identity.device_id).Equals([string]$fleet.gateway_host_device_id, [System.StringComparison]::OrdinalIgnoreCase)
          $isGatewayHost = $machineMatches -and $deviceMatches
          Write-Host "GATEWAY_REPAIR_PRECHECK is_gateway_host=$isGatewayHost critical_files_clean=$criticalClean"

          if (-not $isGatewayHost) { throw 'This runner is not the exact permanent Gateway host; refusing Gateway mutation.' }
          if (-not $criticalClean) { throw 'Gateway-critical Bridge files differ from installed HEAD; refusing Gateway mutation.' }

          $repairScript = Join-Path $env:RUNNER_TEMP "hardware-monitor-gateway-repair-$env:GITHUB_RUN_ID.py"
          @'
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1]).resolve()
          sys.path.insert(0, str(root / 'src'))
          from bridge_common import load_json
          from component_versions import GATEWAY_VERSION
          from gateway_lifecycle import restart_gateway_generation
          from identity import load_fleet, validate_identity
          fleet = load_fleet(root)
          identity = validate_identity(load_json(root / 'config' / 'identity.json'), fleet_id=fleet['fleet_id'])
          result = restart_gateway_generation(root, fleet, identity, expected_version=GATEWAY_VERSION, timeout_seconds=45.0, force=True)
          status = str(result.get('status') or '')
          if status not in {'RESTARTED', 'ALREADY_CURRENT'}:
              raise RuntimeError(f'unexpected Gateway lifecycle status: {status}')
          print(f'GATEWAY_REPAIR_STATUS={status}')
          print(f'GATEWAY_REPAIR_VERSION={result.get("gateway_version") or GATEWAY_VERSION}')
          '@ | Set-Content -Path $repairScript -Encoding UTF8

          try {
            python $repairScript $env:BRIDGE_ROOT
            if ($LASTEXITCODE -ne 0) { throw "Bridge Gateway lifecycle repair failed with exit code $LASTEXITCODE." }
          }
          finally {
            Remove-Item $repairScript -Force -ErrorAction SilentlyContinue
          }

          $localBase = "http://127.0.0.1:$([int]$fleet.gateway_bind_port)"
          $routeText = '/v2/host/hardware-monitor/telemetry'
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            $healthOk = $false
            try {
              $health = Invoke-RestMethod -Uri "$localBase/health" -Method Get -TimeoutSec 2
              $healthOk = ([string]$health.status).ToUpperInvariant() -eq 'READY'
            }
            catch { }

            $routeStatus = -1
            try {
              Invoke-WebRequest -Uri "$localBase$routeText" -Method Post -Body '{}' -ContentType 'application/json' -UseBasicParsing -TimeoutSec 2 | Out-Null
              $routeStatus = 200
            }
            catch {
              try { if ($_.Exception.Response.StatusCode) { $routeStatus = [int]$_.Exception.Response.StatusCode } } catch { }
            }

            if ($healthOk -and $routeStatus -ne -1 -and $routeStatus -ne 404) {
              Write-Host "GATEWAY_REPAIR_ROUTE_READY local_route_unauth=$routeStatus"
              $ready = $true
              break
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) { throw 'Gateway repair completed but telemetry route did not become locally reachable.' }
      - name: Prove real sensor telemetry reaches private Gateway
        shell: powershell
        env:
          BRIDGE_ROOT: ${{ steps.bridge.outputs.bridge_root }}
        run: |
          $sequencePath = Join-Path $env:LOCALAPPDATA 'The Spark\Hardware Monitor\gateway-telemetry-sequence.json'
          dotnet run --project tools/HardwareMonitor.HardwareSmoke/HardwareMonitor.HardwareSmoke.csproj --configuration Release --no-build -- `
            --gateway-bridge-root $env:BRIDGE_ROOT `
            --gateway-sequence-path $sequencePath
          if ($LASTEXITCODE -ne 0) { throw "Gateway telemetry acceptance failed with exit code $LASTEXITCODE." }
